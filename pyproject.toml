[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-fallback-sentinel"
version = "0.2.0"
description = "MCP server and library for resilient LLM calls: retries, provider failover, circuit-breaking, and rigid schema validation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jamie643" }]
keywords = ["mcp", "llm", "resilience", "circuit-breaker", "fallback", "pydantic", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=1.0",
]
providers = [
    "openai>=1.40",
    "anthropic>=0.40",
    "boto3>=1.34",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.4",
    "pre-commit>=3.6",
]

[project.scripts]
agent-fallback-sentinel-mcp = "agent_fallback_sentinel.mcp.server:main"

[project.urls]
Homepage = "https://github.com/Jamie643/agent-fallback-sentinel"
Issues = "https://github.com/Jamie643/agent-fallback-sentinel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=agent_fallback_sentinel --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "scripts",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["N818", "I001", "E501", "N803", "N806"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
explicit_package_bases = true
mypy_path = "src"
namespace_packages = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true
